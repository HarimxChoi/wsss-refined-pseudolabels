dataset:
  root_dir: /data/MSCOCO
  name_list_dir: ./datasets/coco
  num_classes: 81
  crop_size: 320
  resize_range: [512, 2048]
  rescale_range: [0.5, 2.0]
  ignore_index: 255

work_dir:
  dir: /workspace3/results/weclip_rfm_ts
  ckpt_dir: checkpoints
  pred_dir: predictions
  segs_dir: segs
  tb_logger_dir: tb_logger

train:
  split: train
  samples_per_gpu: 8
  max_iters: 80000
  eval_iters: 5000
  log_iters: 200

val:
  split: val

optimizer:
  type: AdamW
  learning_rate: 1e-5
  betas: [0.9, 0.999]
  weight_decay: 0.01

scheduler:
  warmup_iter: 50
  warmup_ratio: 1e-6
  power: 0.0

clip_init:
  clip_pretrain_path: ./pretrained/ViT-B-16.pt
  embedding_dim: 256
  in_channels: [768, 768, 768, 768]
  clip_flag: 16
  resize_long: 512

dino_init:
  dino_model: 'dinov2_vits14'
  dino_fts_fuse_dim: 384
  decoder_layer: 3

# === RFM Teacher-Student ===
rfm_teacher_student:
  enable: true                   # Enable/Disable RFM Teacher-Student
  start_iter: 35000              # Start iteration (warm-up phase)
  ema_tau: 0.996                 # EMA decay for Teacher RFM
  
  # Gate mechanism
  # gate_threshold: 0.80           
  
  # Authority Transfer
  # teacher_weight: 0.60
  teacher_margin: 0.03
  teacher_skip_conf: 0.78 
  
  # Confidence computation weights
  conf_weight_consistency: 0.4
  conf_weight_response:    0.3
  conf_weight_coherence:   0.3

# === URN/BECO ===
urn_T: 1.0
urn_beta: 0.2
urn_gamma_start: 0.68
urn_gamma_end: 0.85
urn_w_min: 0.3
urn_enable_adaptive: true     

beco_alpha: 0.5
lambda_boundary: 0.35

# === EMA (Legacy - not used in RFM TS mode) ===
ema_enable: false              

# === Attention ===
lambda_attn: 0.1

# === CAM ===
seg_attn_q: 0.75
cam_box_thresh: 0.5
trans_rw: 1